name: Desktop

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Instalar el verificador Allium
        run: cargo install allium-cli --version 3.5.0 --locked
      - name: Verificar especificaciones Allium
        shell: bash
        run: |
          set +e
          allium check specs/ | tee "$RUNNER_TEMP/allium-check.json"
          allium_status=${PIPESTATUS[0]}
          set -e
          if [ "$allium_status" -eq 2 ]; then
            exit 2
          fi
          jq -s -e 'all(.[];
            ((.findings // []) | length == 0) and
            ((.diagnostics // []) | all(.severity != "error")))' \
            "$RUNNER_TEMP/allium-check.json"
      - name: Verificar cobertura de la matriz de trazabilidad
        run: npm run traceability:check
      - run: npm run build
      # Algunas suites levantan servidores y sesiones con identidades fijas;
      # en CI deben ejecutarse por archivo para no compartir estado efímero.
      - run: npm test -- --test-concurrency=1
      - run: npm run typecheck

      - name: Verificar que el tag coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:verify-tag

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.sign-check.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Determinar si hay identidad Authenticode
        id: sign-check
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signed = [bool]$env:WIN_CSC_LINK -and [bool]$env:WIN_CSC_KEY_PASSWORD
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $signed) {
            Write-Host '::warning::Faltan WINDOWS_CERTIFICATE/WINDOWS_CERTIFICATE_PASSWORD: se construye sin firmar, como AlphaRelease.'
          }

      - name: Construir instalador y portable firmados
        if: steps.sign-check.outputs.signed == 'true'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run pack:windows -- --publish never

      - name: Construir instalador y portable sin firmar
        if: steps.sign-check.outputs.signed == 'false'
        shell: pwsh
        run: npm run pack:windows -- --publish never

      - name: Marcar y limpiar artefactos sin firmar
        if: steps.sign-check.outputs.signed == 'false'
        shell: pwsh
        run: |
          # Sin firma no hay canal de actualización automática: el manifiesto
          # de electron-updater no debe publicarse (ver AlphaRelease en
          # specs/desktop-distribution.allium, que nunca ofrece auto-update).
          Remove-Item release/latest.yml -ErrorAction SilentlyContinue
          Remove-Item release/*.blockmap -ErrorAction SilentlyContinue
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $safeBase = $_.BaseName -replace ' ', '-'
            Rename-Item $_.FullName -NewName "$safeBase-sin-firmar.exe"
          }

      - name: Checksums
        shell: pwsh
        run: |
          # electron-builder deja diagnósticos con el mismo nombre en todas las
          # plataformas. No son artefactos de distribución y al fusionarlos en
          # la release uno sobrescribiría a los demás.
          Remove-Item release/builder-debug.yml,release/builder-effective-config.yaml -ErrorAction SilentlyContinue
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content release/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vera-Windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS-windows.txt

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.sign-check.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Determinar si hay firma y notarización de Apple
        id: sign-check
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan credenciales de firma/notarización de Apple: se construye sin firmar, como AlphaRelease."
          fi

      - name: Construir DMG universal firmado y notarizado
        if: steps.sign-check.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run pack:mac -- --publish never

      - name: Construir DMG universal sin firmar
        if: steps.sign-check.outputs.signed == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:mac -- --publish never -c.mac.notarize=false

      - name: Marcar y limpiar artefactos sin firmar
        if: steps.sign-check.outputs.signed == 'false'
        run: |
          # Sin firma no hay canal de actualización automática ni sentido en
          # publicar el ZIP (solo existe para que electron-updater arme
          # latest-mac.yml). Ver AlphaRelease en specs/desktop-distribution.allium.
          cd release
          rm -f latest-mac.yml *.zip *.blockmap
          for f in *.dmg; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.dmg}-sin-firmar.dmg"
          done

      - name: Checksums
        run: |
          cd release
          shopt -s nullglob
          rm -f builder-debug.yml builder-effective-config.yaml
          shasum -a 256 *.dmg *.zip *.yml *.blockmap > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vera-macOS-universal
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS-macos.txt

  linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Construir AppImage, paquete deb y manifiesto
        run: npm run pack:linux -- --publish never

      - name: Checksums
        run: |
          cd release
          rm -f builder-debug.yml builder-effective-config.yaml
          shasum -a 256 *.AppImage *.deb *.yml > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vera-Linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/SHA256SUMS-linux.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Vera-*
          path: release
          merge-multiple: true

      - name: Redactar notas de la release
        id: notes
        env:
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          {
            release_notes="docs/releases/$GITHUB_REF_NAME.md"
            if [ ! -f "$release_notes" ]; then
              echo "::error::Faltan las notas de $GITHUB_REF_NAME en $release_notes"
              exit 1
            fi
            cat "$release_notes"
            echo
            echo "Linux (AppImage, deb) es siempre una release estable: no requiere"
            echo "firma de código, así que no depende de certificados comerciales."
            echo
            if [ "$WINDOWS_SIGNED" = "true" ] && [ "$MACOS_SIGNED" = "true" ]; then
              echo "Windows y macOS están firmados y notarizados en esta release."
            else
              echo "### Estado de firma en esta release"
              echo
              if [ "$WINDOWS_SIGNED" = "true" ]; then
                echo "- **Windows**: firmado (Authenticode)."
              else
                echo "- **Windows**: SIN FIRMAR. Windows SmartScreen va a advertir \"Windows protegió tu PC\"."
              fi
              if [ "$MACOS_SIGNED" = "true" ]; then
                echo "- **macOS**: firmado y notarizado."
              else
                echo "- **macOS**: SIN FIRMAR ni notarizado. Gatekeeper va a bloquear la apertura directa."
              fi
              echo
              echo "Vera es todavía una alfa de investigación: conseguir firma de código"
              echo "comercial (Authenticode, notarización de Apple) no es viable ahora"
              echo "mismo para quien la mantiene. Los instaladores sin firmar son"
              echo "exactamente el mismo código que los firmados, verificable con los"
              echo "SHA256SUMS de esta release. Instrucciones para instalar de todas"
              echo "formas: [Instalación en Windows](https://github.com/mediafranca/vera/blob/$GITHUB_REF_NAME/docs/instalacion-windows.md#instalar-sin-firma),"
              echo "[Distribución de escritorio](https://github.com/mediafranca/vera/blob/$GITHUB_REF_NAME/docs/distribucion-escritorio.md#instalar-sin-firma)."
              echo
              echo "Ninguna versión sin firmar recibe actualización automática:"
              echo "actualizar significa volver a descargar de esta página."
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publicar una sola release multiplataforma
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --notes-file "${{ steps.notes.outputs.path }}"
