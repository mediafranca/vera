<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vera</title>
    <meta name="description" content="Memoria personal soberana: versionable, editable, replicable y auditable." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2e0024" />

    <!-- La pestaña y la aplicación instalada llevan la misma marca. Se ofrecen
         cortes raster propios para que el relieve sobreviva también en el
         favicon mínimo, en vez de dejar que cada navegador reduzca el máster. -->
    <link rel="icon" href="/icon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- iOS no lee los iconos del manifiesto ni acepta SVG para la pantalla de
         inicio: sin este PNG usaría una miniatura de la captura de pantalla.
         Las esquinas las redondea el sistema, así que la imagen va a sangre. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Vera" />
    <!-- Junto con viewport-fit=cover, deja que el fondo llegue hasta el notch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <!--
      Red de seguridad. Si el guion de la aplicación no llega a ejecutarse —sin
      red, con el service worker sirviendo un armazón cuyo asset no tiene
      cacheado, o con un error de carga— la página quedaba en blanco y muda.
      Este aviso vive en el HTML, así que no depende de nada que pueda fallar, y
      el propio arranque lo retira en cuanto toma el control.
    -->
    <div id="sin-arranque" role="status">
      <p>Vera no pudo arrancar.</p>
      <p>Puede que el servidor no esté respondiendo. Se reintenta solo.</p>
      <button type="button" onclick="location.reload()">recargar</button>
    </div>

    <div id="vera-root" data-layout="split">
      <header id="bar">
        <!-- La marca la dibuja icons.ts, para que el icono tenga una sola
             definición y no se separe del que usa el resto de la interfaz. El
             nombre sigue estando, en la etiqueta accesible y en el título. -->
        <!--
          La marca lleva al día de hoy.
          Un logotipo que no hace nada es un adorno ocupando el sitio más
          alcanzable de la barra, y en toda aplicación con marca arriba a la
          izquierda esa marca lleva a casa. Aquí la casa es hoy: el sitio desde
          donde se escribe sin haber decidido antes dónde. Con esto sobra el
          calendario, que decía lo mismo con un icono más.
        -->
        <button id="brand" title="El día de hoy" aria-label="Ir al día de hoy"></button>

        <!-- Atrás y adelante: los del navegador, inmediatamente después de casa. -->
        <nav id="nav" aria-label="Navegación">
          <button id="back" aria-label="Atrás" title="Atrás"></button>
          <button id="forward" aria-label="Adelante" title="Adelante"></button>
        </nav>

        <!--
          El switch de la vista, de tres posiciones y en el orden del espacio que
          gobierna: mapa a la izquierda, texto a la derecha, y en medio los dos.
          Mover el switch a la derecha es acercarse; a la izquierda, alejarse.
          Los dibujos los pone icons.ts.
        -->
        <div id="view-switch" role="group" aria-label="Vista">
          <button data-layout="graph_only" aria-label="Sólo el mapa" title="Sólo el mapa"></button>
          <button data-layout="split" aria-label="Mapa y texto" title="Mapa y texto"></button>
          <button data-layout="text_only" aria-label="Sólo el texto" title="Sólo el texto"></button>
        </div>

        <!-- El buscador toma el espacio que sobra: es lo único de la barra que
             mejora al ser más ancho.

             Lo que encuentra no cuelga del campo sino de la barra, y por eso
             `#results` sale de aquí: ver más abajo. -->
        <!--
          En un teléfono el buscador se pliega en su lupa y se despliega encima
          de la barra al pulsarla. Un campo vacío esperando ocupa media barra
          para no decir nada; el icono ocupa lo que ocupa un botón, y el campo
          aparece cuando hay algo que buscar. En pantalla ancha no hace falta:
          allí el buscador cabe y estar visible es parte de lo que ofrece.
        -->
        <button id="search-open" aria-label="Buscar" title="Buscar en el grafo"></button>

        <!--
          El buscador y lo que encuentra, juntos.

          `#results` cuelga del campo y no de la barra: se quiere del ancho del
          buscador y no de la pantalla, así que nace dentro de `#search-wrap`
          —que es `position: relative`— y toma su ancho. Un título largo se
          recorta con puntos suspensivos en vez de ensanchar la lista.
        -->
        <div id="search-wrap">
          <input id="search" type="search" placeholder="buscar en el grafo" autocomplete="off" />
          <button id="search-close" type="button" aria-label="Cerrar búsqueda" title="Cerrar búsqueda"></button>
          <div id="results" hidden></div>
        </div>

        <div id="controls">
          <!-- El contenido de estos tres lo pone icons.ts. El texto accesible
               va en aria-label, que es lo que se lee: un icono a solas no se
               anuncia, y el dibujo no reemplaza al nombre de la acción. -->
          <button
            id="insert-voice"
            aria-label="Insertar voz"
            title="Hablar: lo grabado queda en el día de hoy"
          ></button>
          <button id="settings" aria-label="Ajustes" title="Ajustes de Vera"></button>
        </div>

        <output id="sync-state" aria-live="polite" aria-atomic="true" hidden></output>
      </header>

      <!--
        De izquierda a derecha, de lo general a lo particular.

        El mapa es el «ante»: el total, desde donde uno se ubica y filtra. El
        texto es el «dentro». La lectura occidental va en ese sentido, así que
        entrar en un documento es un movimiento hacia la derecha y salir a mirar
        el conjunto es uno hacia la izquierda. Invertirlo obligaría a leer al
        revés lo que se está haciendo.
      -->
      <section id="graph">
        <!--
          Lo que gobierna el mapa vive en el mapa. Un control puesto lejos de lo
          que gobierna obliga a aprender una correspondencia que la disposición
          podría haber contado sola.
        -->
        <!--
          Lo que gobierna el mapa vive en el mapa, y dentro de un panel que se
          puede cerrar. Un mapa es para mirarlo: sus controles no pueden ocupar
          sitio permanente sobre lo que se está mirando.
        -->
        <!--
          El ojo y su menú.

          Un mapa es para mirarlo: sus controles se despliegan cuando hacen falta
          y se recogen cuando no. El menú cae bajo el ojo, como cualquier menú, y
          crece hacia abajo a medida que le pongamos más cosas.
        -->
        <div id="map-controls">
          <button
            id="map-panel-toggle"
            aria-label="Controles del mapa"
            aria-expanded="false"
            aria-controls="map-panel"
            title="Controles del mapa"
          ></button>

          <div id="map-panel" role="group" aria-label="Controles del mapa" hidden>
            <label class="map-field">
              <span class="map-field-name">dimensión</span>
              <span class="map-choice">
                <button data-view="graph_2d">2D</button>
                <button data-view="graph_3d">3D</button>
                <button data-view="graph_d4">D4</button>
              </span>
            </label>

            <!--
              El alcance se cuenta en saltos, y los saltos se dan de uno en uno.
              Aquí había un deslizador, que es el control de una magnitud
              continua: pedía apuntar a un valor entre cuatro y decía «cuánto»
              donde la pregunta es «cuántos saltos». Dos flechas y el número
              dicen lo que hay: uno más, uno menos, y en cuál se está.
            -->
            <div class="map-field">
              <span class="map-field-name" id="map-reach-name">proximidad</span>
              <span class="map-choice map-step" role="group" aria-labelledby="map-reach-name">
                <button id="map-reach-less" type="button" aria-label="Un salto menos"></button>
                <output id="map-reach-value" for="map-reach-less map-reach-more">2</output>
                <button id="map-reach-more" type="button" aria-label="Un salto más"></button>
              </span>
            </div>

            <label class="map-field">
              <span class="map-field-name">diarios</span>
              <span class="map-choice">
                <button id="map-journals" type="button" role="switch" aria-checked="false">apagados</button>
              </span>
            </label>

            <label class="map-field" id="map-auto-rotate-field" hidden>
              <span class="map-field-name">rotación automática</span>
              <span class="map-choice">
                <button id="map-auto-rotate" type="button" role="switch" aria-checked="false">apagada</button>
              </span>
            </label>
          </div>
        </div>

        <!-- Por dónde se ha pasado, acumulándose. Al pie del mapa y fuera del
             panel: es lo que uno mira para saber dónde está, y no algo que se
             abra para consultarlo. -->
        <nav id="map-trail" aria-label="Por dónde se ha pasado"></nav>
      </section>
      <div id="divider" role="separator" aria-orientation="vertical" tabindex="0"></div>
      <main id="text"></main>
      <div id="tokens" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
